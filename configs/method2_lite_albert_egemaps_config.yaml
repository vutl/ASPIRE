# Configuration for ASPIRE-Lite+: Tiny audio + eGeMAPS + ALBERT-small text

data:
  csv: "datasets/IEMOCAP_KFOLD/tenfolds/all.csv"
  max_audio_length: 160000
  max_text_length: 96
  sample_rate: 16000

model:
  name: "method2_crossattn_av_lite_albert_egemaps"
  wavlm_model_name: "tiny-mel-audio"
  wavlm_prosody_model_name: null
  roberta_model_name: "sentence-transformers/paraphrase-albert-small-v2"
  num_emotions: 4
  hidden_dim: 256
  av_refinement_layers: 2
  freeze_wavlm: false
  freeze_roberta: true
  num_cross_attn_heads: 8
  post_attention_layers: 2
  av_prediction_layers: 3

training:
  batch_size: 16
  epochs: 30
  learning_rate: 0.0002
  weight_decay: 0.00001
  num_workers: 2

loss:
  type: "ccc"
  emotion_weight: 1.0
  arousal_weight: 1.0
  valence_weight: 1.0
  use_focal: false

optimizer:
  type: "adamw"
  betas: [0.9, 0.999]
  eps: 1.0e-08

scheduler:
  type: "reduce_on_plateau"
  mode: "max"
  factor: 0.5
  patience: 5
  min_lr: 1.0e-06

device: "cuda:0"
seed: 42
