# Configuration for Method 2 with W-PRO: Cross-Attention A-V with WavLM-Pro for Prosody
# This config uses Orange/Speaker-wavLM-pro for prosody branch (specialized non-timbral features)

# Data
data:
  csv: "datasets/IEMOCAP_KFOLD/tenfolds/all.csv"
  max_audio_length: 160000  # 10 seconds at 16kHz
  max_text_length: 128      # Maximum text tokens
  sample_rate: 16000

# Model
model:
  name: "method2_crossattn_av"
  wavlm_model_name: "microsoft/wavlm-base-plus"  # For final WavLM branch
  wavlm_prosody_model_name: "Orange/Speaker-wavLM-pro"  # W-PRO for prosody branch (non-timbral features)
  roberta_model_name: "roberta-base"
  num_emotions: 4
  hidden_dim: 256
  av_refinement_layers: 2
  freeze_wavlm: true  # Freeze ALL WavLM models (prosody + final)
  freeze_roberta: true  # Freeze RoBERTa
  num_cross_attn_heads: 8
  post_attention_layers: 2
  av_prediction_layers: 3

# Training
training:
  batch_size: 8  # May need to adjust based on W-PRO size
  epochs: 30
  learning_rate: 0.0001
  weight_decay: 0.00001
  num_workers: 2  # Reduced to avoid server lag

# Loss
loss:
  type: "ccc"  # CCC recommended for continuous A-V values
  emotion_weight: 1.0
  arousal_weight: 1.0  # Equal importance with emotion
  valence_weight: 1.0  # Equal importance with emotion
  use_focal: false  # Standard W-PRO, NO focal loss

# Optimizer
optimizer:
  type: "adamw"
  betas: [0.9, 0.999]
  eps: 1.0e-08

# Scheduler
scheduler:
  type: "reduce_on_plateau"
  mode: "max"
  factor: 0.5
  patience: 5
  min_lr: 1.0e-06

# Paths
paths:
  log_dir: "logs"
  checkpoint_dir: "checkpoints/method2_kfold_wpro"  # NEW checkpoint directory (separate from old runs)
  tensorboard_dir: "logs/tensorboard"

# Device
device: "cuda:0"

# Misc
seed: 42

# Notes
# Key differences from standard method2_config.yaml:
# 1. Uses Orange/Speaker-wavLM-pro for prosody branch (specialized for non-timbral features)
# 2. Saves checkpoints to method2_kfold_wpro/ (does NOT overwrite old checkpoints)
# 3. ALL pretrained models frozen (freeze_wavlm: true, freeze_roberta: true)
# 4. Only ~6.3M task-specific parameters are trained
# 5. W-PRO provides better prosody representation for arousal modeling

# W-PRO Model Info:
# - Base model: WavLM-large (fine-tuned for prosody extraction)
# - Output: Non-timbral embeddings (prosody, accent, speaking style)
# - Training data: VoxCeleb + VCTK (English-focused)
# - Embedding size: Depends on variant (250 for W-PRO main)
# - Paper: Gengembre et al., Interspeech 2024
