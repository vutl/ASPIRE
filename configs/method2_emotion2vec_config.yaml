# Configuration for Method 2 with W-PRO + Emotion2Vec
# Uses W-PRO for prosody branch and Emotion2Vec embeddings for final acoustic branch

# Data
data:
  train_csv: "datasets/IEMOCAP_KFOLD/tenfolds/all.csv"
  test_csv: "datasets/IEMOCAP_KFOLD/tenfolds/all.csv"
  # Absolute path to the actual emotion2vec outputs folder (embeddings + mapping jsons)
  emotion2vec_dir: "/home4/quanpn/ICME2026/only_gay/outputs/iemocap/emotion2vec_base_npy"
  emotion2vec_dim: 768
  max_audio_length: 160000  # 10 seconds at 16kHz
  max_text_length: 128      # Maximum text tokens
  sample_rate: 16000

# Model
model:
  name: "method2_crossattn_av_emotion2vec"
  wavlm_model_name: "microsoft/wavlm-base-plus"  # Not used for final branch, but kept for config consistency
  wavlm_prosody_model_name: "Orange/Speaker-wavLM-pro"  # W-PRO for prosody branch
  roberta_model_name: "roberta-base"
  num_emotions: 4
  hidden_dim: 256
  av_refinement_layers: 2
  freeze_wavlm: true
  freeze_roberta: true
  num_cross_attn_heads: 8
  post_attention_layers: 2
  av_prediction_layers: 3

# Training
training:
  batch_size: 4
  epochs: 30
  learning_rate: 0.0001
  weight_decay: 0.00001
  num_workers: 4

# Loss
loss:
  type: "ccc"
  emotion_weight: 1.0
  arousal_weight: 1.0
  valence_weight: 1.0

# Optimizer
optimizer:
  type: "adamw"
  betas: [0.9, 0.999]
  eps: 1.0e-08

# Scheduler
scheduler:
  type: "reduce_on_plateau"
  mode: "max"
  factor: 0.5
  patience: 5
  min_lr: 1.0e-06

# Paths
paths:
  log_dir: "logs"
  checkpoint_dir: "checkpoints/method2_kfold_emotion2vec"
  tensorboard_dir: "logs/tensorboard"

# Device
device: "cuda:0"  # Will be overridden by script

# Misc
seed: 42
