# Configuration for Method 2 with W-PRO + Focal Loss: Cross-Attention A-V with WavLM-Pro for Prosody
# Uses focal loss on emotion branch to combat class imbalance (especially Neutral collapse)

# Data
data:
  # NOTE: Script uses --csv command line argument, not config CSV files
  # Default: datasets/IEMOCAP_KFOLD/tenfolds/all.csv (k-fold format, 10-fold → 5-fold mapping)
  max_audio_length: 160000  # 10 seconds at 16kHz
  max_text_length: 128      # Maximum text tokens
  sample_rate: 16000

# Model
model:
  name: "method2_crossattn_av"
  wavlm_model_name: "microsoft/wavlm-base-plus"  # For final WavLM branch
  wavlm_prosody_model_name: "Orange/Speaker-wavLM-pro"  # W-PRO for prosody branch (non-timbral features)
  roberta_model_name: "roberta-base"
  num_emotions: 4
  hidden_dim: 256
  av_refinement_layers: 2
  freeze_wavlm: true  # Freeze ALL WavLM models (prosody + final)
  freeze_roberta: true  # Freeze RoBERTa
  num_cross_attn_heads: 8
  post_attention_layers: 2
  av_prediction_layers: 3

# Training
training:
  batch_size: 4  # May need to adjust based on W-PRO size
  epochs: 30
  learning_rate: 0.0001
  weight_decay: 0.00001
  num_workers: 4

# Loss
loss:
  type: "ccc"  # CCC recommended for continuous A-V values
  emotion_weight: 1.0
  arousal_weight: 1.0  # Equal importance with emotion
  valence_weight: 1.0  # Equal importance with emotion
  use_focal: true      # Use focal loss for emotion branch to fight class collapse
  focal_alpha: 0.25    # Lower alpha emphasizes rare classes (Neutral)
  focal_gamma: 2.0     # Down-weight easy examples

# Optimizer
optimizer:
  type: "adamw"
  betas: [0.9, 0.999]
  eps: 1.0e-08

# Scheduler
scheduler:
  type: "reduce_on_plateau"
  mode: "max"
  factor: 0.5
  patience: 5
  min_lr: 1.0e-06

# Paths
paths:
  log_dir: "logs"
  checkpoint_dir: "checkpoints/method2_kfold_wpro_focal"  # NEW checkpoint directory for focal variant
  tensorboard_dir: "logs/tensorboard"

# Device
device: "cuda:0"

# Misc
seed: 42

# Notes
# Key differences from method2_wpro_config.yaml:
# 1. Uses focal loss on emotion branch (alpha=0.25, gamma=2.0)
# 2. Saves checkpoints to method2_kfold_wpro_focal/ (separate from standard W-PRO)
# 3. All other settings identical to standard W-PRO (frozen WavLM + RoBERTa)
# 4. Epoch count is 30 (standard training length)
# 5. Focal loss emphasizes hard negatives and rare Neutral class
