# Configuration for SSL Baseline: Simple WavLM-only A-V-D model
# MSP-Podcast Dataset
# Uses only WavLM (no prosody/text branches)

# Data
data:
  train_csv: "datasets/MSP-Podcast/labels_consensus_train.csv"
  dev_csv: "datasets/MSP-Podcast/labels_consensus_dev.csv"
  test1_csv: "datasets/MSP-Podcast/labels_consensus_test1.csv"
  test2_csv: "datasets/MSP-Podcast/labels_consensus_test2.csv"
  max_audio_length: 160000  # 10 seconds at 16kHz
  max_text_length: 128
  sample_rate: 16000

# Model
model:
  name: "ssl_baseline_avd"
  wavlm_model_name: "microsoft/wavlm-base-plus"
  num_emotions: 8  # MSP-Podcast has 8 emotions
  hidden_dim: 256
  av_refinement_layers: 2
  freeze_wavlm: true
  av_prediction_layers: 3

# Training
training:
  batch_size: 8
  epochs: 10
  learning_rate: 0.0001
  weight_decay: 0.00001
  num_workers: 4

# Loss
loss:
  type: "ccc"
  emotion_weight: 1.0
  arousal_weight: 1.0
  valence_weight: 1.0
  dominance_weight: 1.0

# Optimizer
optimizer:
  type: "adamw"
  betas: [0.9, 0.999]
  eps: 1.0e-08

# Scheduler
scheduler:
  type: "reduce_on_plateau"
  mode: "max"
  factor: 0.5
  patience: 3
  min_lr: 1.0e-06

# Paths
paths:
  log_dir: "logs"
  checkpoint_dir: "checkpoints/ssl_baseline_msp"
  tensorboard_dir: "logs/tensorboard"

# Device
device: "cuda:0"

# Misc
seed: 42

# Notes
# SSL Baseline using only WavLM for MSP-Podcast:
# - Audio -> WavLM -> 2 branches
# - Branch 1: AVD prediction -> AV_refined
# - Branch 2: Emotion embedding
# - Final: [emotion_embedding + AV_refined] -> Emotion classifier
# - Simple baseline without prosody/text modalities
# - MSP-Podcast has 8 emotion categories
