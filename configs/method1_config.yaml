# Configuration for Method 1: Triple WavLM

# Data
data:
  # NOTE: Script uses --csv command line argument, not config CSV files
  # Default: datasets/IEMOCAP_KFOLD/tenfolds/all.csv (k-fold format, 10-fold → 5-fold mapping)
  audio_max_length: 160000  # 10 seconds at 16kHz
  sample_rate: 16000
  num_workers: 4

# Model
model:
  name: "method1_triple_wavlm"
  wavlm_model: "microsoft/wavlm-base-plus"
  num_emotions: 4
  hidden_dim: 256
  av_refinement_layers: 2
  freeze_wavlm: true

# Training
training:
  batch_size: 8
  num_epochs: 50
  learning_rate: 0.0001
  weight_decay: 0.0001
  gradient_clip_norm: 1.0

# Loss
loss:
  type: "ccc"  # CCC recommended for continuous A-V values
  emotion_weight: 1.0
  arousal_weight: 1.0  # Equal importance with emotion
  valence_weight: 1.0  # Equal importance with emotion

# Optimizer
optimizer:
  type: "adamw"
  betas: [0.9, 0.999]
  eps: 1.0e-08

# Scheduler
scheduler:
  type: "reduce_on_plateau"
  mode: "max"
  factor: 0.5
  patience: 5
  min_lr: 1.0e-06

# Paths
paths:
  log_dir: "logs"
  checkpoint_dir: "checkpoints"
  tensorboard_dir: "logs/tensorboard"

# Device
device: "cuda:0"

# Misc
seed: 42
