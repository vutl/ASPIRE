# Configuration for Method 2 W-PRO Simplified: Cross-Attention A-V-D with Simplified Final Fusion
# MSP-Podcast Dataset
# Final fusion ONLY takes [WavLM_pooled + AV_refined] (no arousal/valence embeddings)

# Data
data:
  train_csv: "datasets/MSP-Podcast/labels_consensus_train.csv"
  dev_csv: "datasets/MSP-Podcast/labels_consensus_dev.csv"
  test1_csv: "datasets/MSP-Podcast/labels_consensus_test1.csv"
  test2_csv: "datasets/MSP-Podcast/labels_consensus_test2.csv"
  max_audio_length: 160000  # 10 seconds at 16kHz
  max_text_length: 128
  sample_rate: 16000

# Model
model:
  name: "method2_wpro_simplified"
  wavlm_model_name: "microsoft/wavlm-base-plus"  # For final WavLM branch
  wavlm_prosody_model_name: "Orange/Speaker-wavLM-pro"  # W-PRO for prosody
  roberta_model_name: "roberta-base"
  num_emotions: 8  # MSP-Podcast has 8 emotions
  hidden_dim: 256
  av_refinement_layers: 2
  freeze_wavlm: true
  freeze_roberta: true
  num_cross_attn_heads: 8
  post_attention_layers: 2
  av_prediction_layers: 3

# Training
training:
  batch_size: 8
  epochs: 10
  learning_rate: 0.0001
  weight_decay: 0.00001
  num_workers: 4

# Loss
loss:
  type: "ccc"
  emotion_weight: 1.0
  arousal_weight: 1.0
  valence_weight: 1.0
  dominance_weight: 1.0

# Optimizer
optimizer:
  type: "adamw"
  betas: [0.9, 0.999]
  eps: 1.0e-08

# Scheduler
scheduler:
  type: "reduce_on_plateau"
  mode: "max"
  factor: 0.5
  patience: 3
  min_lr: 1.0e-06

# Paths
paths:
  log_dir: "logs"
  checkpoint_dir: "checkpoints/wpro_simplified_msp"
  tensorboard_dir: "logs/tensorboard"

# Device
device: "cuda:0"

# Misc
seed: 42

# Notes
# Simplified version of Method 2 W-PRO AVD for MSP-Podcast:
# - Final fusion input: [WavLM_pooled (768) + AV_refined (256)] = 1024 dim
# - Does NOT include arousal_embedding, valence_embedding, branch_fused
# - Tests whether simpler fusion is sufficient
# - MSP-Podcast has 8 emotion categories
