# Configuration for Method 2 W-PRO with ASR Text on MSP-Podcast
# Uses Whisper ASR transcripts instead of ground-truth transcripts

# Data
data:
  tsv_path: "datasets/MSP-Podcast/msp_podcast_asr.tsv"  # TSV with asr_transcript column
  asr_column: "asr_transcript"  # Column name for ASR text
  max_audio_length: 160000  # 10 seconds at 16kHz
  max_text_length: 128
  sample_rate: 16000

# Model
model:
  name: "method2_crossattn_av"
  wavlm_model_name: "microsoft/wavlm-base-plus"
  wavlm_prosody_model_name: "Orange/Speaker-wavLM-pro"  # W-PRO for prosody
  roberta_model_name: "roberta-base"
  num_emotions: 4
  hidden_dim: 256
  av_refinement_layers: 2
  freeze_wavlm: true
  freeze_roberta: true
  num_cross_attn_heads: 8
  post_attention_layers: 2
  av_prediction_layers: 3

# Training
training:
  batch_size: 8
  epochs: 10
  learning_rate: 0.0001
  weight_decay: 0.00001
  num_workers: 4

# Loss
loss:
  type: "ccc"
  emotion_weight: 1.0
  arousal_weight: 1.0
  valence_weight: 1.0

# Optimizer
optimizer:
  type: "adamw"
  betas: [0.9, 0.999]
  eps: 1.0e-08

# Scheduler
scheduler:
  type: "reduce_on_plateau"
  mode: "max"
  factor: 0.5
  patience: 3
  min_lr: 1.0e-06

# Paths
paths:
  log_dir: "logs"
  checkpoint_dir: "checkpoints/method2_msp_wpro_asr"
  tensorboard_dir: "logs/tensorboard"

# Device
device: "cuda:0"

# Misc
seed: 42

# Notes
# - Uses ASR transcripts from Whisper instead of ground-truth
# - Evaluates impact of ASR errors on emotion recognition
# - W-PRO prosody branch + RoBERTa semantic branch (with ASR text)
