# Configuration for Method 2: Cross-Attention A-V (Recommended)

# Data
data:
  # NOTE: Script uses --csv command line argument, not config CSV files
  # Default: datasets/IEMOCAP_KFOLD/tenfolds/all.csv (k-fold format, 10-fold → 5-fold mapping)
  max_audio_length: 160000  # 10 seconds at 16kHz
  max_text_length: 128      # Maximum text tokens
  sample_rate: 16000

# Model
model:
  name: "method2_crossattn_av"
  wavlm_model_name: "microsoft/wavlm-base-plus"
  roberta_model_name: "roberta-base"
  num_emotions: 4
  hidden_dim: 256
  av_refinement_layers: 2
  freeze_wavlm: true
  freeze_roberta: true
  num_cross_attn_heads: 8
  post_attention_layers: 2
  av_prediction_layers: 3

# Training
training:
  batch_size: 2  # Reduced from 8 due to large model (319M params + 3 models)
  epochs: 30
  learning_rate: 0.0001
  weight_decay: 0.00001
  num_workers: 4

# Loss
loss:
  type: "ccc"  # CCC recommended for continuous A-V values
  emotion_weight: 1.0
  arousal_weight: 1.0  # Equal importance with emotion
  valence_weight: 1.0  # Equal importance with emotion

# Optimizer
optimizer:
  type: "adamw"
  betas: [0.9, 0.999]
  eps: 1.0e-08

# Scheduler
scheduler:
  type: "reduce_on_plateau"
  mode: "max"
  factor: 0.5
  patience: 5
  min_lr: 1.0e-05

# Paths
paths:
  log_dir: "logs"
  checkpoint_dir: "checkpoints"
  tensorboard_dir: "logs/tensorboard"

# Device
device: "cuda:0"

# Misc
seed: 42

# Notes
# This method is more efficient than Method 1:
# - 41.7% fewer parameters
# - Uses WavLM only 2 times instead of 3
# - Bidirectional cross-attention allows prosody and text to exchange information
