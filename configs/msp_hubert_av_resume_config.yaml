# Configuration for HuBERT A-V Resume Training on MSP-Podcast
# Optimized for CPU-efficient training (num_workers=0)

# Data
data:
  tsv_path: "datasets/MSP-Podcast/msp_podcast.tsv"
  max_audio_length: 160000  # 10 seconds at 16kHz
  max_text_length: 128      # Maximum text tokens
  sample_rate: 16000

# Model
model:
  name: "hubert_av"
  hubert_model_name: "facebook/hubert-base-ls960"
  num_emotions: 4  # ang, hap, neu, sad
  hidden_dim: 256
  av_refinement_layers: 2
  freeze_hubert: true

# Training
training:
  batch_size: 4  # Keep same as before
  epochs: 10
  learning_rate: 0.0001
  weight_decay: 0.00001
  num_workers: 0  # CPU-efficient: no worker processes

# Loss
loss:
  type: "ccc"
  emotion_weight: 1.0
  arousal_weight: 1.0
  valence_weight: 1.0

# Optimizer
optimizer:
  type: "adamw"
  betas: [0.9, 0.999]
  eps: 1.0e-08

# Scheduler
scheduler:
  type: "reduce_on_plateau"
  mode: "max"
  factor: 0.5
  patience: 3

# Paths
paths:
  tensorboard_dir: "logs/tensorboard"
  checkpoint_dir: "checkpoints/msp_hubert_av"
