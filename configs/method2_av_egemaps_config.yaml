# Method2 A-V with eGeMAPS config for MSP-Podcast
# Architecture: WavLM + RoBERTa + eGeMAPS features → Cross-Attention → A-V + Emotion

# Data configuration
wavlm_dir: "datasets/MSP-Podcast/wavlm_embeddings"
roberta_dir: "datasets/MSP-Podcast/roberta_embeddings"
egemaps_dir: "outputs/msp_podcast/egemaps_npy"
mapping_json: "outputs/msp_podcast/egemaps_npy/mapping.json"

# Model
audio_dim: 768  # WavLM-base-plus output dimension
text_dim: 768   # RoBERTa-base output dimension
egemaps_dim: 88 # eGeMAPS dimension
hidden_dim: 256
num_emotions: 4  # hap, sad, neu, ang
num_transformer_layers: 4
num_heads: 8
ff_dim: 512
dropout: 0.1

# Training
batch_size: 64
epochs: 50
learning_rate: 0.0001
weight_decay: 0.00001
num_workers: 0

# Scheduler
scheduler_type: "cosine_annealing"

# Logging
log_dir: "logs/msp_podcast_method2_egemaps_tensorboard"

# Device
device: "cuda:0"

# Misc
seed: 42

# Output
output_dir: "checkpoints/method2_msp_av_egemaps"
